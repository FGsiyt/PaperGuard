[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "paperguard"
version = "1.0.0"
description = "Local, evidence-based academic reference auditing"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "pypdf>=5,<7", "fonttools>=4.50,<5", "pylatexenc>=2.10,<3", "bibtexparser>=1.4,<2", "rapidfuzz>=3,<4", "openpyxl>=3.1,<4", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
paperguard = "paperguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
